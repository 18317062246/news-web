# Merge these locations into the existing virtual host after checking route precedence.
# The actual static root is deployment-specific.
location = /ccdata {
  return 301 /ccdata/$is_args$args;
}

location = /m/ccdata {
  return 301 /ccdata/$is_args$args;
}

location ~ ^/m/ccdata/(?<legacy_tail>.*)$ {
  return 301 /ccdata/$legacy_tail$is_args$args;
}

location ^~ /_ccdata_assets/ {
  root /var/www/ccdata-current;
  try_files $uri =404;
  add_header Cache-Control "public, max-age=31536000, immutable";
}

location ^~ /ccdata/ {
  root /var/www/ccdata-current;
  try_files $uri @ccdata_entry;
  add_header Cache-Control "no-cache";
}

location @ccdata_entry {
  root /var/www/ccdata-current;
  try_files /index.html =404;
  add_header Cache-Control "no-cache";
}

# 页脚接口 更新时间&版本号
location = /api/app-version {
  proxy_pass https://mobileapi.centanet.com/bizcom/java/json/reply/AppVersionRequest?cityen=sh&platform=pc;
  proxy_ssl_server_name on;
  proxy_set_header Host mobileapi.centanet.com;
  proxy_set_header X-Real-IP $remote_addr;
}
